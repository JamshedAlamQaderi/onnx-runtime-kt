product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64, macosArm64, jvm]

dependencies:
  - //onnxrt-kt: exported
  - $libs.kotlinx.coroutines.core
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.jamshedalamqaderi.kmp.onnxrtkt.sample.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true

test-settings@jvm:
  jvm:
    test:
      freeJvmArgs: [ --enable-native-access=ALL-UNNAMED ]
