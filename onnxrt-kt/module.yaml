description: Kotlin Multiplatform bindings for ONNX Runtime (JVM, Android, Apple, Linux, Windows).

product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosSimulatorArm64, macosArm64, linuxX64, linuxArm64, mingwX64, js, wasmJs]

aliases:
  # JVM and Android share the same ONNX Runtime Java API (ai.onnxruntime.*).
  - jvmAndAndroid: [jvm, android]
  # Everything but the web, where ONNX Runtime is synchronous (adds createSession/run).
  - nonWeb: [jvm, android, iosArm64, iosSimulatorArm64, macosArm64, linuxX64, linuxArm64, mingwX64]
  # Where inference tests can run on the build machine (Android's local tests can't load the Android .so).
  - jvmAndNative: [jvm, iosArm64, iosSimulatorArm64, macosArm64, linuxX64, linuxArm64, mingwX64]

dependencies:
  - $libs.kotlinx.coroutines.core

test-dependencies:
  - $libs.kotlinx.coroutines.test

dependencies@jvm:
  - $libs.onnxruntime.jvm: exported

dependencies@android:
  - $libs.onnxruntime.android: exported

# Native targets use the ONNX Runtime C API through a small C layer (native-shim/).
# The build plugin downloads Microsoft's official binaries and generates the cinterop definitions:
# Apple targets link the static library, Linux and Windows embed the official shared library.
plugins:
  onnxruntime-native: enabled

settings:
  kotlin:
    explicitApi: strict
  android:
    namespace: com.jamshedalamqaderi.kmp.onnxrtkt
  publishing:
    enabled: true
    group: com.jamshedalamqaderi.kmp
    version: 0.1.0-SNAPSHOT
    artifactId: onnxrt-kt
    publishSources: true
    pom:
      name: onnxrt-kt
      description: Kotlin Multiplatform bindings for ONNX Runtime.

settings@native:
  kotlin:
    optIns: [ kotlinx.cinterop.ExperimentalForeignApi, kotlinx.cinterop.BetaInteropApi ]

settings@web:
  kotlin:
    optIns: [ kotlin.js.ExperimentalWasmJsInterop ]

test-settings@jvm:
  jvm:
    test:
      freeJvmArgs: [ --enable-native-access=ALL-UNNAMED ]
